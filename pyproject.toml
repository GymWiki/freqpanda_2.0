[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freqpanda"
version = "0.1.0"
description = "Crypto trading bot platform: strategy schema/interpreter (phase 1), data pipeline (phase 2), backtest engine (phase 3), optimization/generation (phase 4)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "ta>=0.10",
    "PyYAML>=6.0",
    "ccxt>=4.0",
    "psycopg2-binary>=2.9",
    "optuna>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["freqpanda_strategy", "freqpanda_data", "freqpanda_backtest", "freqpanda_optimize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
